// Copy to game/csgo/cfg/rtv_hud.cfg. Loaded at plugin load and each map start.
// Reload from server console: exec rtv_hud.cfg
rtvhud_allow_change 1
// Agreement percentage: ceil(authenticated humans * percent / 100), bots excluded.
rtvhud_required_percent 100
// Seconds; initial wait and cooldown allow 0 (disabled).
rtvhud_initial_delay 30
rtvhud_cooldown 30
rtvhud_vote_duration 30
rtvhud_result_duration 5
rtvhud_browser_timeout 120
// CS2 UI sound events or vsnd paths (same `play` transport as CS2MenuManager).
// Empty string disables that sound. Copy your CS2MenuManager [Sound] values here.
rtvhud_move_sound "UIPanorama.round_report_odds_none"
rtvhud_select_sound "UIPanorama.round_report_odds_up"

// End-of-map selection and empty-server rotation.
rtvhud_end_vote 1
rtvhud_end_vote_lead 60
sv_hibernate_when_empty 0
